name: Launch Readiness

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_package:
        description: "Skip the package stage"
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write

concurrency:
  group: launch-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Stage 1 - Audit Production Readiness
    runs-on: ubuntu-latest
    outputs:
      report: ${{ steps.audit.outputs.report }}
      gaps: ${{ steps.audit.outputs.gaps }}
    steps:
      - uses: actions/checkout@v4

      - name: Run readiness audit
        id: audit
        run: |
          chmod +x scripts/launch/audit.sh
          bash scripts/launch/audit.sh

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: readiness-report
          path: launch-readiness-report.md
          retention-days: 30

      - name: Comment audit on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('launch-readiness-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });

  harden:
    name: Stage 2 - Security & Production Hardening
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Dependency vulnerability scan (Trivy fs)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-fs.sarif"
          exit-code: "0"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Static analysis (Semgrep)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
            p/secrets
        continue-on-error: true

      - name: Apply production hardening checks
        run: |
          chmod +x scripts/launch/harden.sh
          bash scripts/launch/harden.sh

      - name: Upload hardening report
        uses: actions/upload-artifact@v4
        with:
          name: hardening-report
          path: hardening-report.md
          retention-days: 30

  package:
    name: Stage 3 - Package Release
    runs-on: ubuntu-latest
    needs: [audit, harden]
    if: ${{ !inputs.skip_package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo "0.0.0-$(git rev-parse --short HEAD)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cdx.json

      - name: Scan built image
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: "sarif"
          output: "trivy-image.sarif"

      - name: Upload image scan
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Create release archive
        run: |
          chmod +x scripts/launch/package.sh
          VERSION="${{ steps.version.outputs.version }}" bash scripts/launch/package.sh

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 90
